name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TSO_ENVIRONMENT: test
      TSO_DATA_DIR: /tmp/tso-backend
      TSO_DATABASE_URL: sqlite+aiosqlite:////tmp/tso-tests.db
      TSO_MASTER_KEY: ci-only-master-key-never-use-outside-tests-2026
      TSO_TELEGRAM_API_ID: ""
      TSO_TELEGRAM_API_HASH: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: backend
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen --extra dev
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests alembic
      - name: Pytest
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  migration-compose:
    name: PostgreSQL migration and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tso
          POSTGRES_USER: tso
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tso -d tso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TSO_ENVIRONMENT: test
      TSO_DATA_DIR: /tmp/tso-migration
      TSO_DATABASE_URL: postgresql+asyncpg://tso:migration-test-only@127.0.0.1:5432/tso
      TSO_MASTER_KEY: ci-only-master-key-never-use-outside-tests-2026
      TSO_TELEGRAM_API_ID: ""
      TSO_TELEGRAM_API_HASH: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: migration-compose
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Upgrade a disposable PostgreSQL database
        working-directory: backend
        run: uv run alembic -c alembic.ini upgrade head
      - name: Verify migrations match the models
        working-directory: backend
        run: uv run alembic -c alembic.ini check
      - name: Validate the production Compose model
        env:
          POSTGRES_PASSWORD: compose-validation-only
          TSO_ENV_FILE: ${{ runner.temp }}/compose-empty.env
        run: |
          touch "$TSO_ENV_FILE"
          docker compose -f compose.yaml config --quiet

  playwright:
    name: Playwright workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-suffix: playwright
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser workflows
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
