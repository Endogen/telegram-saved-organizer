map $request_method $auth_limit_key {
    default "";
    POST $binary_remote_addr;
}

map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sse_per_ip:10m;

# The Compose port binds to loopback by default, so only the host TLS proxy can
# reach this service. Resolve its forwarded client address before applying edge
# quotas, then replace the header sent to the API with that resolved address.
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 1m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https://i.ytimg.com; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location = /api/session {
        limit_req zone=auth_per_ip burst=10 nodelay;
        proxy_pass http://api:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location = /api/account/register {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://api:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location ~ ^/api/telegram/connection(?:/verify)?$ {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://api:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location = /api/scan/stream {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn sse_per_ip 3;
        proxy_pass http://api:8500;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=60 nodelay;
        proxy_pass http://api:8500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
