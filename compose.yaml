x-backend: &backend
  build:
    context: .
    target: backend
  env_file: ${TSO_ENV_FILE:-.env}
  environment:
    TSO_ENVIRONMENT: production
    TSO_DATABASE_URL: postgresql+asyncpg://tso:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/tso
    TSO_PROCESS_SCANS_IN_API: "false"
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tso
      POSTGRES_USER: tso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tso -d tso"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8500"
      - --workers
      - "2"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8500/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.telegram.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    ports:
      - "${TSO_HTTP_BIND:-127.0.0.1}:${TSO_HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
